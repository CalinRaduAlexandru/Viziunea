<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Viziunea</title>
</head>
<body>
  <div id="app"></div>
  <script>
    const base = location.pathname === '/Viziunea' || location.pathname.startsWith('/Viziunea/') ? '/Viziunea' : '';
    const requested = location.pathname.startsWith(base) ? location.pathname.slice(base.length) || '/' : '/';
    history.replaceState({}, '', `${base}/${requested.replace(/^\//, '')}${location.search}${location.hash}`.replace(`${base}//`, `${base}/`));
    const stylesheet = document.createElement('link');
    stylesheet.rel = 'stylesheet';
    stylesheet.href = `${base}/styles.css`;
    document.head.append(stylesheet);
    const appScript = document.createElement('script');
    appScript.type = 'module';
    appScript.src = `${base}/src/main.js?v=20260921-4`;
    document.body.append(appScript);
  </script>
</body>
</html>
